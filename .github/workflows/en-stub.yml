name: Translate new ES posts to EN

on:
  push:
    branches: [main]
    paths:
      - "content/es/posts/**"                        # ES-post changes trigger this
      - "content/es/noticias-cruzando-el-mar/**"     # …and noticias changes
  workflow_dispatch:
    inputs:
      posts:
        description: "Space-separated ES markdown path(s) to (re)translate, e.g. content/es/posts/my-post.md. Leave blank to use the posts changed in the triggering commit."
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # to dispatch hugo.yml after pushing (see below)

concurrency:
  group: en-stub
  cancel-in-progress: false

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2              # need the previous commit for the diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade deepl python-frontmatter

      - name: Translate new ES posts into EN
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        # On manual dispatch, inputs.posts (if any) names the files to translate;
        # otherwise the script falls back to the BEFORE..SHA diff.
        run: python3 scripts/make_en_stubs.py ${{ github.event.inputs.posts }}

      - name: Commit & push any new translations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain content/en)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/en
            git commit -m "Auto: EN translation for new ES post(s)"
            # Survive concurrent pushes (CMS / flyers Action move main): rebase + retry.
            branch="${GITHUB_REF_NAME:-main}"
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
                echo "Pushed on attempt $attempt"; pushed=1; break
              fi
              echo "Push attempt $attempt failed (main moved); retrying…"
              sleep $(( (RANDOM % 4) + 2 ))
            done
            if [ -z "$pushed" ]; then echo "Failed to push EN translation after retries"; exit 1; fi
            # A push made with GITHUB_TOKEN never triggers other workflows, so
            # hugo.yml would not redeploy and the EN post would stay offline
            # until the next human push. workflow_dispatch is the exception.
            gh workflow run hugo.yml --ref "$branch"
          else
            echo "No new EN translations."
          fi
