<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager — CELE</title>
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    // Bloque "Resumen Observatorio" para el editor de texto.
    //
    // Inserta el shortcode {{< observatorio-mes >}} en el cuerpo del boletín sin
    // que quien edita tenga que escribir la sintaxis a mano. Los totales no se
    // calculan acá: el shortcode los resuelve contra los CSV al construir el
    // sitio, así que la vista previa sólo muestra qué período quedó elegido.
    (function () {
      var DATASETS = {
        ambos: 'proyectos y leyes',
        proyectos: 'sólo proyectos',
        leyes: 'sólo leyes'
      };

      function register() {
        window.CMS.registerEditorComponent({
          id: 'observatorio-mes',
          label: 'Resumen Observatorio',
          icon: 'bar_chart',
          fields: [
            {
              name: 'month',
              label: 'Mes',
              widget: 'string',
              hint: 'Formato AAAA-MM. Por ejemplo, 2025-06 para junio de 2025.',
              pattern: ['^\\d{4}-(0[1-9]|1[0-2])$', 'Usá el formato AAAA-MM (ej. 2025-06)']
            },
            {
              name: 'dataset',
              label: 'Datos a incluir',
              widget: 'select',
              default: 'ambos',
              options: [
                { label: 'Proyectos y leyes', value: 'ambos' },
                { label: 'Sólo proyectos', value: 'proyectos' },
                { label: 'Sólo leyes', value: 'leyes' }
              ]
            }
          ],
          pattern: /^\s*\{\{<\s*observatorio-mes\s+month="(?<month>[^"]+)"(?:\s+dataset="(?<dataset>[^"]+)")?\s*>\}\}\s*$/m,
          fromBlock: function (match) {
            var g = (match && match.groups) || {};
            return { month: g.month || '', dataset: g.dataset || 'ambos' };
          },
          toBlock: function (data) {
            var month = data.month || '';
            var dataset = data.dataset || 'ambos';
            var extra = dataset && dataset !== 'ambos' ? ' dataset="' + dataset + '"' : '';
            return '{{< observatorio-mes month="' + month + '"' + extra + ' >}}';
          },
          toPreview: function (data) {
            var month = data.month || '(sin mes)';
            var scope = DATASETS[data.dataset || 'ambos'] || DATASETS.ambos;
            return (
              '<figure style="margin:1.5rem 0;padding:1rem 1.2rem;border:1px solid #D6D6D6;' +
              'background:#fff;font-family:Inter,system-ui,sans-serif;">' +
              '<figcaption style="font-size:.72rem;font-weight:700;letter-spacing:.08em;' +
              'text-transform:uppercase;color:#666;">Resumen Observatorio · ' +
              month + ' · ' + scope + '</figcaption>' +
              '<p style="margin:.7rem 0 0;font-size:.85rem;color:#666;font-style:italic;">' +
              'Los totales por país e impacto se calculan al publicar.</p>' +
              '</figure>'
            );
          }
        });

        // Bloque "Cronología del mes".
        //
        // Marca dónde se dibuja la lista país por país. Los datos NO se cargan
        // acá: se cargan en el campo "El mes, país por país" del formulario, y
        // este bloque sólo elige el lugar del cuerpo donde aparecen. Por eso no
        // tiene campos: es un marcador, no un editor.
        window.CMS.registerEditorComponent({
          id: 'boletin-paises',
          label: 'Cronología del mes',
          icon: 'list',
          fields: [],
          pattern: /^\s*\{\{<\s*boletin-paises\s*>\}\}\s*$/m,
          fromBlock: function () {
            return {};
          },
          toBlock: function () {
            return '{{< boletin-paises >}}';
          },
          toPreview: function () {
            return (
              '<figure style="margin:1.5rem 0;padding:1rem 1.2rem;border:1px solid #D6D6D6;' +
              'background:#fff;font-family:Inter,system-ui,sans-serif;">' +
              '<figcaption style="font-size:.72rem;font-weight:700;letter-spacing:.08em;' +
              'text-transform:uppercase;color:#666;">Cronología del mes</figcaption>' +
              '<p style="margin:.7rem 0 0;font-size:.85rem;color:#666;font-style:italic;">' +
              'Acá va la lista país por país, con lo que cargues en el campo ' +
              '“El mes, país por país”.</p>' +
              '</figure>'
            );
          }
        });

        // Bloque "Aviso".
        //
        // El recuadro destacado del cuerpo, típicamente el anuncio de la
        // próxima mesa. Cuerpo libre en Markdown.
        var ICONOS = { calendario: '🗓', dato: '◆', alerta: '!', ninguno: '' };

        window.CMS.registerEditorComponent({
          id: 'aviso',
          label: 'Aviso',
          icon: 'campaign',
          fields: [
            {
              name: 'icono',
              label: 'Ícono',
              widget: 'select',
              default: 'calendario',
              options: [
                { label: 'Calendario (anuncio de mesa)', value: 'calendario' },
                { label: 'Rombo (dato destacado)', value: 'dato' },
                { label: 'Alerta', value: 'alerta' },
                { label: 'Sin ícono', value: 'ninguno' }
              ]
            },
            {
              name: 'cuerpo',
              label: 'Texto',
              widget: 'text',
              hint: 'Admite Markdown: **negrita**, *cursiva*, [enlaces](https://…).'
            }
          ],
          pattern: /^\s*\{\{<\s*aviso(?:\s+icono="(?<icono>[^"]*)")?\s*>\}\}\n(?<cuerpo>[\s\S]*?)\n\{\{<\s*\/aviso\s*>\}\}\s*$/m,
          fromBlock: function (match) {
            var g = (match && match.groups) || {};
            return { icono: g.icono || 'calendario', cuerpo: g.cuerpo || '' };
          },
          toBlock: function (data) {
            var icono = data.icono || 'calendario';
            var extra = icono !== 'calendario' ? ' icono="' + icono + '"' : '';
            return '{{< aviso' + extra + ' >}}\n' + (data.cuerpo || '') + '\n{{< /aviso >}}';
          },
          toPreview: function (data) {
            var glifo = ICONOS[data.icono || 'calendario'] || '';
            var texto = (data.cuerpo || '').replace(/[<>&]/g, function (c) {
              return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
            });
            return (
              '<aside style="margin:1.5rem 0;padding:1rem 1.15rem;border-left:3px solid #ad2b25;' +
              'background:#f5f1ea;font-family:Inter,system-ui,sans-serif;font-size:.95rem;">' +
              (glifo ? '<span style="margin-right:.6rem;">' + glifo + '</span>' : '') +
              texto +
              '</aside>'
            );
          }
        });
      }

      // El bundle del CMS define window.CMS al ejecutarse; esperarlo por si el
      // navegador todavía no terminó de evaluarlo.
      if (window.CMS && window.CMS.registerEditorComponent) {
        register();
      } else {
        var tries = 0;
        var timer = setInterval(function () {
          if (window.CMS && window.CMS.registerEditorComponent) {
            clearInterval(timer);
            register();
          } else if (++tries > 100) {
            clearInterval(timer);
            console.error('[CELE] No se pudieron registrar los bloques del editor: CMS no disponible.');
          }
        }, 100);
      }
    })();
  </script>
</body>
</html>
