# Vocabulario cerrado de etiquetas de los boletines del Observatorio Legislativo.
#
# Los .md de los boletines escriben el slug (la clave); acá se resuelve el
# nombre que se imprime, en ES y en EN. Si un boletín usa un slug que no está
# en esta lista, `boletin-paises.html` avisa al construir el sitio y lo imprime
# tal cual, así que una etiqueta nueva se nota pero no rompe la publicación.
#
# OJO: esto NO es la columna «Objetivo legítimo» de la matriz (esa taxonomía
# vive en content/es/observatorio-legislativo/objetivos-legitimos.md y tiene 19
# categorías). Comparten temas pero son dos vocabularios distintos, con dos
# propósitos distintos: aquél clasifica el objetivo declarado de la norma, éste
# etiqueta de qué trata la entrada del boletín. No unificarlos a menos que se
# decida explícitamente.
#
# Para agregar una etiqueta: sumar la entrada acá y nada más. Si en algún
# momento se publica un índice por etiqueta, el slug ya es la URL.

